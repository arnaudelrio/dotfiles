# Set programs that you use
$terminal = kitty
$code = code
$fileManager = thunar
$fileManagerVim = kitty vifm
$menu = wofi --show drun
$browser = firefox
$obsidian = obsidian

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, Q, exec, $terminal
bind = SUPER, C, killactive, 
bind = SUPER, M, exec, [workspace special:magic; float; move 1490 50; size 400 580] youtube-music
bind = SUPER, M, exec, [workspace special:magic; float; move 1490 640; size 400 410] kitty pacmixer
bind = SUPER, E, exec, $fileManager
bind = SUPER, W, exec, $fileManagerVim
bind = SUPER, V, togglefloating, 
bind = SUPER, R, exec, $menu
bind = SUPER, P, pseudo, # dwindle
bind = SUPER SHIFT, P, togglesplit, # dwindle
bind = SUPER, O, exec, $obsidian
bind = SUPER, Delete, exec, wlogout
bind = SUPER SHIFT, Delete, exec, hyprlock
bind = SUPER SHIFT, O, exec, [workspace O] obsidian

# Focus
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Move active window
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d 

# Resize
bind = SUPER CTRL, h, resizeactive, -20 0
bind = SUPER CTRL, l, resizeactive, 20 0
bind = SUPER CTRL, k, resizeactive, 0 -20
bind = SUPER CTRL, j, resizeactive, 0 20 

# Move floating window
bind = SUPER ALT, h, moveactive, -20 0
bind = SUPER ALT, l, moveactive, 20 0
bind = SUPER ALT, k, moveactive, 0 -20
bind = SUPER ALT, j, moveactive, 0 20

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Silent Move To Workspace
bind = SUPER CONTROL, 1, movetoworkspacesilent, 1
bind = SUPER CONTROL, 2, movetoworkspacesilent, 2
bind = SUPER CONTROL, 3, movetoworkspacesilent, 3
bind = SUPER CONTROL, 4, movetoworkspacesilent, 4
bind = SUPER CONTROL, 5, movetoworkspacesilent, 5
bind = SUPER CONTROL, 6, movetoworkspacesilent, 6
bind = SUPER CONTROL, 7, movetoworkspacesilent, 7
bind = SUPER CONTROL, 8, movetoworkspacesilent, 8
bind = SUPER CONTROL, 9, movetoworkspacesilent, 9
bind = SUPER CONTROL, 0, movetoworkspacesilent, 10

# Special workspaces (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic
bind = SUPER, D, togglespecialworkspace, secret
bind = SUPER SHIFT, D, movetoworkspace, special:secret

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Playback control
bind =, 148, exec, playerctl previous
bind =, 75, exec, playerctl next
bind = SUPER, 65, exec, playerctl play-pause

bind = SUPER, XF86AudioRaiseVolume, exec, playerctl next
bind = SUPER, XF86AudioLowerVolume, exec, playerctl previous
bind = SUPER, XF86AudioMute, exec, playerctl play-pause

# Audio volume
bind = ,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
