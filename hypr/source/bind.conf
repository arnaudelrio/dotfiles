#############################
# Key bindings for Hyprland #
# Author: Al4st0r           #
#############################

############
# Programs #
############

# Set programs that you use
$dashboard = eww open --toggle dashboard
$terminal = kitty
$code = zeditor
$fileManager = thunar
$fileManagerVim = kitty vifm
$menu = rofi -show drun
# $menu = tofi-drun --terminal=$terminal | xargs hyprctl dispatch exec
$browser = zen-browser # or firefox
$music = [workspace special:music; float; move 1490 50; size 400 580] youtube-music
$musicControl = [workspace special:music; float; move 1490 640; size 400 410] $terminal pacmixer
$obsidian = obsidian
$message = telegram-desktop
$SPARKscript = /home/Al4st0r/Backdoor/SPARK/startSPARK.sh
$MosquituxScript = /home/Al4st0r/Backdoor/Mosquitux/startMosquitux.sh

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, RETURN, exec, $dashboard
bind = SUPER, Q, exec, $terminal
bind = SUPER SHIFT, Q, exec, $terminal nvim
bind = SUPER, Z, exec, $code
bind = SUPER, O, exec, $obsidian
bind = SUPER, C, killactive,
bind = SUPER, M, exec, $music
bind = SUPER, M, exec, $musicControl
bind = SUPER, N, exec, $browser -P Main
bind = SUPER CTRL, N, exec, $browser -P Secondary
bind = SUPER SHIFT, N, exec, $browser -P Main --private-window
bind = SUPER ALT, N, exec, $browser -P Work
bind = SUPER CTRL ALT, N, exec, $browser -P
bind = SUPER, T, exec, $message
bind = SUPER, E, exec, $fileManagerVim
bind = SUPER SHIFT, E, exec, $fileManager
bind = SUPER, V, togglefloating,
bind = SUPER, R, exec, $menu
bind = SUPER, P, pin,
bind = SUPER SHIFT, P, togglesplit, # dwindle
bind = SUPER ALT, P, pseudo, # dwindle

# System and logout
bind = SUPER, Delete, exec, wlogout
bind = SUPER SHIFT, Delete, exec, hyprlock
bind = SUPER CTRL, Delete, exec, systemctl suspend
bind = SUPER CTRL SHIFT, Delete, exec, systemctl poweroff

# Custom scripts
bind = SUPER, A, exec, $terminal $SPARKscript
bind = SUPER SHIFT, A, exec, $terminal $MosquituxScript

###################
# System controls #
###################

# Brightness control
binde = SHIFT, XF86MonBrightnessDown, exec, brightnessctl set 1%-
binde = SHIFT, XF86MonBrightnessUp, exec, brightnessctl set 1%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = CTRL, XF86MonBrightnessDown, exec, brightnessctl set 10%-
binde = CTRL, XF86MonBrightnessUp, exec, brightnessctl set 10%+

# Playback control
bind = SUPER, 65, exec, playerctl play-pause
bind = SUPER, XF86AudioRaiseVolume, exec, playerctl next
bind = SUPER, XF86AudioLowerVolume, exec, playerctl previous
bind = SUPER, XF86AudioMute, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Audio volume
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = SHIFT, XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
binde = SHIFT, XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
binde = , XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = CTRL, XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
binde = CTRL, XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

# Screenshotting
bind = , print, exec, hyprshot --mode region
bind = SUPER, print, exec, hyprshot --mode window
bind = SUPER SHIFT, print, exec, hyprshot --mode output

################
# Window binds #
################
bind = , F11, fullscreen,

# Tabbed Windows
bind = SUPER, G, togglegroup
binde = SUPER, TAB, changegroupactive

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
binde = SUPER CTRL ALT, h, workspace, e-1
binde = SUPER CTRL ALT, l, workspace, e+1

# Move window to the left/right workspace with mainMod + SHIFT + scroll
bind = SUPER SHIFT, mouse_down, movetoworkspace, e+1
bind = SUPER SHIFT, mouse_up, movetoworkspace, e-1
binde = SUPER CTRL SHIFT, h, movetoworkspace, e-1
binde = SUPER CTRL SHIFT, l, movetoworkspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Focus
binde = SUPER, h, movefocus, l
binde = SUPER, l, movefocus, r
binde = SUPER, k, movefocus, u
binde = SUPER, j, movefocus, d

# Move active window
binde = SUPER SHIFT, h, movewindow, l
binde = SUPER SHIFT, l, movewindow, r
binde = SUPER SHIFT, k, movewindow, u
binde = SUPER SHIFT, j, movewindow, d

# Resize
binde = SUPER CTRL, h, resizeactive, -20 0
binde = SUPER CTRL, l, resizeactive, 20 0
binde = SUPER CTRL, k, resizeactive, 0 -20
binde = SUPER CTRL, j, resizeactive, 0 20

# Move floating window
binde = SUPER ALT, h, moveactive, -20 0
binde = SUPER ALT, l, moveactive, 20 0
binde = SUPER ALT, k, moveactive, 0 -20
binde = SUPER ALT, j, moveactive, 0 20

# Move to group
binde = SUPER SHIFT ALT, h, moveintogroup, l
binde = SUPER SHIFT ALT, l, moveintogroup, r
binde = SUPER SHIFT ALT, k, moveintogroup, u
binde = SUPER SHIFT ALT, j, moveintogroup, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Silent Move To Workspace
bind = SUPER CONTROL, 1, movetoworkspacesilent, 1
bind = SUPER CONTROL, 2, movetoworkspacesilent, 2
bind = SUPER CONTROL, 3, movetoworkspacesilent, 3
bind = SUPER CONTROL, 4, movetoworkspacesilent, 4
bind = SUPER CONTROL, 5, movetoworkspacesilent, 5
bind = SUPER CONTROL, 6, movetoworkspacesilent, 6
bind = SUPER CONTROL, 7, movetoworkspacesilent, 7
bind = SUPER CONTROL, 8, movetoworkspacesilent, 8
bind = SUPER CONTROL, 9, movetoworkspacesilent, 9
bind = SUPER CONTROL, 0, movetoworkspacesilent, 10

# Special workspaces (scratchpad)
bind = SUPER, S, togglespecialworkspace, music
bind = SUPER SHIFT, S, movetoworkspace, special:music
bind = SUPER CONTROL, S, movetoworkspacesilent, special:music
bind = SUPER, D, togglespecialworkspace, secret
bind = SUPER SHIFT, D, movetoworkspace, special:secret
bind = SUPER CONTROL, D, movetoworkspacesilent, special:secret
bind = SUPER, F, togglespecialworkspace, fantasy
bind = SUPER SHIFT, F, movetoworkspace, special:fantasy
bind = SUPER CONTROL, F, movetoworkspacesilent, special:fantasy

