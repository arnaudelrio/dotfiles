# Monitors (See https://wiki.hyprland.org/Configuring/Monitors/)
monitor=,highres,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = hyprpaper
exec-once = waybar
exec-once = [workspace special:music; float; move 1490 50; size 400 580] youtube-music
exec-once = [workspace special:music; float; move 1490 640; size 400 410] kitty pacmixer
exec-once = [workspace 1] bash /home/Al4st0r/SPARK/startSPARK.sh
